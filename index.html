<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You've got a gift 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Kalam:wght@700&display=swap" rel="stylesheet">
<!--
  J.A.R.V.I.S festival gift page (published on GitHub Pages). The email's
  "Open your gift" button links here with the card in the URL's #fragment
  (base64url JSON: f festival, t to, n from, a amount, c claim code,
  m message, g 1 for a greeting card with no gift in it, and the greeting
  card's own: h title, l "hi" for a Hindi one, s style, p photo (big, down
  the side on a birthday; the card takes its colour), q 0 for no shayari, r the sender's email for a reply), which
  browsers never send to the server. The page shows the
  card the way the email used to and plays the festival's tune: right away
  where the browser allows sound, else at the tap that opens the gift box.
  A greeting card skips that box: it opens straight away (a tap anywhere
  then brings the sound, where the browser wants one first).
  The gift itself (amount, claim code) and the sender's message stay hidden
  until the tune is done. While it plays, Santa crosses the card once, in
  step with it (diyas on Diwali, balloons on a birthday, colours on Holi,
  the moon on Eid, rakhi knots on Raksha Bandhan), then comes back to its
  middle; there, like a film, he takes the gift out and hands it over, and
  it bursts open into the voucher and the message, as Jarvis's voice wishes
  them. Diwali has no tune first: its diyas bring the gift straight away.
  Tunes: songs/<festival>.mp3 (a public-domain tune), voices:
  voices/<festival>.mp3 (Jarvis's voice), both made by the host-agent,
  services/extras/festival_gifts.py, make_page_songs().
-->
<style>
  :root { --c1: #4338ca; --c2: #0e7490; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: #0f172a;
    background: radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--c1) 55%, #0b1020), #070a14 70%);
    display: flex; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden;
  }
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .fx span { position: absolute; top: -20px; color: #fff; opacity: .85; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  /* a birthday: balloons go up, not down */
  .fx span.up, .gc-fx span.up { top: auto; bottom: -50px; animation-name: rise; }
  @keyframes rise { 0% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-60vh) rotate(6deg); } 100% { transform: translateY(-120vh) rotate(-6deg); } }

  /* a birthday party: confetti, and a cake whose candles they blow out */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; animation: drop linear forwards; }
  @keyframes drop { to { transform: translate(var(--sway), 110vh) rotate(var(--spin)); } }
  .cake-wrap { margin: 4px 0 10px; text-align: center; }
  .cake { position: relative; display: inline-block; width: 170px; height: 150px; }
  .cake > * { position: absolute; left: 50%; transform: translateX(-50%); }
  .cake .plate { bottom: 0; width: 170px; height: 12px; border-radius: 50%; background: #e2e8f0; box-shadow: 0 4px 10px rgba(15,23,42,.2); }
  .cake .tier { border-radius: 10px 10px 6px 6px; background-color: var(--fest2); /* the festival's, never the photo's */
                background-image: radial-gradient(circle, #fde047 0 2px, transparent 3px), radial-gradient(circle, #fff 0 2px, transparent 3px),
                                  linear-gradient(180deg, #fff 0 9px, transparent 9px);
                background-size: 22px 16px, 28px 18px, 100% 100%; background-position: 4px 14px, 15px 22px, 0 0; }
  .cake .bottom { bottom: 8px; width: 150px; height: 48px; }
  .cake .top { bottom: 54px; width: 108px; height: 38px; background-color: var(--fest1); }
  .cake .candles { bottom: 90px; display: flex; gap: 18px; }
  .cake .candle { position: relative; width: 8px; height: 30px; border-radius: 2px;
                  background: repeating-linear-gradient(135deg, #fff 0 4px, #f472b6 4px 8px); }
  .cake .flame { position: absolute; left: 50%; bottom: 100%; width: 10px; height: 16px; margin: 0 0 2px -5px; border-radius: 50% 50% 45% 45%;
                 background: radial-gradient(circle at 50% 70%, #fff7c2, #fbbf24 45%, #f97316 80%); box-shadow: 0 0 12px 4px rgba(251,191,36,.6);
                 transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; transition: opacity .3s, transform .3s; }
  .cake .candle:nth-child(2) .flame { animation-delay: -.2s; }
  @keyframes flicker { to { transform: scale(.9, 1.1) rotate(4deg); } }
  .cake .smoke { position: absolute; left: 50%; bottom: 100%; margin-left: -8px; font-size: 16px; opacity: 0; }
  .cake.out .flame { opacity: 0; transform: scale(.2); }
  .cake.out .smoke { animation: smoke 1.6s ease-out forwards; }
  @keyframes smoke { 20% { opacity: .8; } to { opacity: 0; transform: translateY(-40px) scale(1.6); } }
  .cake-wrap .wish-now { margin-top: 2px; font: 600 13px "Segoe UI", sans-serif; color: var(--c1); }
  .royal .cake-wrap .wish-now { color: #f5d06f; }

  .wrap { position: relative; width: 100%; max-width: 560px; }

  /* the wrapped gift, before it's opened */
  .gift { text-align: center; color: #fff; cursor: pointer; user-select: none; transition: opacity .5s, transform .5s; }
  .gift .box { font-size: 120px; line-height: 1; display: inline-block; animation: wobble 1.6s ease-in-out infinite; filter: drop-shadow(0 10px 30px rgba(0,0,0,.4)); }
  .gift h1 { margin: 18px 0 6px; font-size: 28px; }
  .gift p { margin: 0; opacity: .85; font-size: 16px; }
  .gift .tap { margin-top: 22px; display: inline-block; padding: 12px 28px; border-radius: 999px; background: #fff; color: var(--c1); font-weight: 700; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  @keyframes wobble { 0%, 100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-7deg) scale(1.04); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-3deg) scale(1.02); } }
  .gift.opening .box { animation: burst .6s ease-in forwards; }
  @keyframes burst { to { transform: scale(1.6) rotate(12deg); opacity: 0; } }
  .gift.gone { opacity: 0; transform: scale(.9); pointer-events: none; position: absolute; inset: 0; }

  /* the card, as the email showed it */
  .card { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.35);
          opacity: 0; transform: translateY(30px) scale(.96); transition: opacity .6s, transform .6s; display: none; }
  .card.shown { display: block; }
  .card.in { opacity: 1; transform: none; }
  .banner { background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; text-align: center; padding: 34px 24px; }
  .banner .mark { font-size: 54px; line-height: 1; }
  .banner .greet { margin-top: 10px; font-size: 28px; font-weight: 700; }
  .banner .from { margin-top: 6px; font-size: 15px; opacity: .92; }
  .body { padding: 28px 26px 10px; text-align: center; }
  .label { margin-top: 18px; font-size: 13px; letter-spacing: 2px; color: #64748b; text-transform: uppercase; }
  .amount { margin-top: 4px; font-size: 46px; font-weight: 800; color: var(--c1); }
  .code { margin-top: 6px; display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border: 2px dashed var(--c1);
          border-radius: 10px; font: bold 22px/1.2 "Courier New", monospace; letter-spacing: 3px; background: #fff7ed; }
  .code button { font: 600 12px "Segoe UI", sans-serif; letter-spacing: 0; padding: 6px 10px; border-radius: 8px; border: 0; background: var(--c1); color: #fff; cursor: pointer; }
  .later { margin-top: 18px; font-size: 13px; color: #64748b; }
  .msg { margin: 22px auto 0; max-width: 420px; padding: 14px 18px; border-left: 4px solid var(--c2); background: #f8fafc; border-radius: 6px;
         text-align: left; font-size: 15px; line-height: 1.55; color: #334155; white-space: pre-line; position: relative; }
  /* a greeting card (no gift): an envelope, drawn in em so it grows with its font-size */
  .env { position: relative; display: inline-block; width: 1.5em; height: 1em; perspective: 3em; vertical-align: middle; }
  .env > span { position: absolute; }
  .env .back { inset: 0; border-radius: .07em; background: color-mix(in srgb, var(--c1) 70%, #000); }
  .env .letter { z-index: 1; left: .1em; right: .1em; top: .08em; height: .8em; border-radius: .04em; background-color: #fffdf7;
                 background-image: repeating-linear-gradient(transparent 0 .1em, rgba(15,23,42,.12) .1em .11em);
                 background-size: 70% 100%; background-position: 50% .3em; background-repeat: no-repeat;
                 transition: transform .8s .25s cubic-bezier(.2, .8, .3, 1); }
  .env .front { z-index: 1; inset: 0; border-radius: .07em; background: linear-gradient(160deg, color-mix(in srgb, var(--c1) 80%, #fff), var(--c1));
                clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); }
  .env .flap { z-index: 2; left: 0; right: 0; top: 0; height: .58em; transform-origin: 50% 0;
               background: linear-gradient(180deg, color-mix(in srgb, var(--c2) 65%, #fff), var(--c2));
               clip-path: polygon(0 0, 100% 0, 50% 100%); transition: transform .5s ease-in-out; }
  .env .seal { z-index: 3; left: 50%; top: 56%; font-size: .17em; width: 1.9em; height: 1.9em; margin: -.95em 0 0 -.95em;
               border-radius: 50%; line-height: 1.9em; text-align: center; background: radial-gradient(circle at 35% 35%, #fde68a, #d97706);
               box-shadow: 0 .1em .25em rgba(0,0,0,.35); transition: opacity .2s; }
  .env.open .seal { opacity: 0; }
  .env.open .flap { transform: rotateX(180deg); z-index: 0; }
  .env.open .letter { transform: translateY(-.55em); }
  .card.greeting .body { min-height: 250px; }
  /* a birthday card: no card around it, just the greeting card itself, wider,
     with the photo down its side */
  .wrap.wide { max-width: 760px; }
  .card.bare { background: transparent; box-shadow: none; }
  .card.bare .banner { display: none; }
  .card.bare .body { padding: 0; }
  .gbook.side { max-width: 760px; }
  .gcard.side { display: flex; gap: 24px; align-items: stretch; padding: 28px; }
  .gcard.side .gc-photo { flex: 0 0 38%; width: 38%; height: auto; min-height: 340px; max-height: none; margin: 0; border-radius: 12px;
                          border: 3px solid #fff; box-shadow: 0 0 0 2px var(--c1-60), 0 10px 24px rgba(15,23,42,.25); }
  .gcard.side .gc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 620px) {
    .gcard.side { flex-direction: column; padding: 24px 18px; }
    .gcard.side .gc-photo { width: 100%; flex-basis: auto; min-height: 0; height: 260px; }
  }
  .card.greeting .wait { margin-top: 80px; } /* room for the envelope to land and open */
  .drop.away { opacity: 0; transform: translate(-50%, -30%) scale(.85); transition: opacity .5s, transform .5s; }

  /* the greeting card, a book that opens: classic (cream), festive (the
     festival's pattern) or royal (dark, a golden frame). Its colours are
     mixed in the script (--paper, --c1-35 …): "Save" (html2canvas) can't
     read color-mix() */
  .gbook { position: relative; max-width: 440px; margin: 4px auto 0; perspective: 1600px; }
  .gc-cover { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center;
              border-radius: 14px; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2));
              box-shadow: inset 0 0 0 7px rgba(255,255,255,.15), inset 0 0 0 8px rgba(253,224,71,.7), 0 12px 30px rgba(15,23,42,.25);
              transform-origin: 0 50%; backface-visibility: hidden; transition: transform 1.1s cubic-bezier(.5, .1, .3, 1), opacity .3s 1s; }
  .gc-cover .big { font-size: 72px; line-height: 1; filter: drop-shadow(0 0 16px rgba(253,224,71,.7)); }
  .gc-cover .for { margin-top: 12px; font: 400 34px/1.1 "Great Vibes", "Segoe Script", cursive; }
  .gbook.open .gc-cover { transform: rotateY(-178deg); opacity: 0; pointer-events: none; }
  .gcard { position: relative; overflow: hidden; padding: 34px 26px 22px; text-align: center; border-radius: 14px;
           background: radial-gradient(circle at 50% 0, var(--paper), #fffdf7 65%);
           border: 2px solid var(--c1-35);
           box-shadow: inset 0 0 0 7px #fffdf7, inset 0 0 0 8px var(--c1-50), 0 12px 30px rgba(15,23,42,.15); }
  .gcard::before, .gcard::after { content: "✦"; position: absolute; top: 16px; color: var(--c2); font-size: 14px; }
  .gcard::before { left: 20px; }
  .gcard::after { right: 20px; }
  .gcard.royal { border-color: #d4a017; background: radial-gradient(circle at 50% 0, var(--night), #120c05 72%);
                 box-shadow: inset 0 0 0 7px #120c05, inset 0 0 0 8px #f5d06f, inset 0 0 0 11px #120c05, inset 0 0 0 12px rgba(245,208,111,.5),
                             0 12px 30px rgba(0,0,0,.35); }
  .gcard.royal::before, .gcard.royal::after { color: #f5d06f; }
  .gc-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .gc-fx span { position: absolute; top: -16px; font-size: 12px; opacity: .55; animation: gcfall linear infinite; }
  @keyframes gcfall { to { transform: translateY(110vh) rotate(200deg); } }
  .gcard > :not(.gc-fx):not(.gc-bg) { position: relative; }
  /* the photo, faint and blurred, behind the whole card */
  .gc-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(26px) saturate(1.3);
           opacity: .5; pointer-events: none; }
  .royal .gc-bg { opacity: .35; }
  .gc-photo { display: block; margin: 0 auto 10px; object-fit: cover; background: #fff; }
  .gc-photo.wide { width: 100%; max-height: 240px; border-radius: 10px; margin-top: 4px; box-shadow: 0 6px 16px rgba(15,23,42,.2); }
  .gc-photo.round { width: 104px; height: 104px; border-radius: 50%; border: 3px solid #fff;
                    box-shadow: 0 0 0 3px var(--c1-60), 0 6px 16px rgba(15,23,42,.2); }
  .royal .gc-photo.round { box-shadow: 0 0 0 3px #f5d06f, 0 6px 16px rgba(0,0,0,.4); }
  .gc-mark { font-size: 46px; line-height: 1; animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.07); filter: drop-shadow(0 0 10px rgba(253,224,71,.85)); } }
  .gc-title { margin-top: 12px; font: 400 40px/1.15 "Great Vibes", "Segoe Script", "Brush Script MT", cursive; color: var(--c1); }
  .gc-title.hi { font: 700 34px/1.3 "Kalam", "Tiro Devanagari Hindi", serif; }
  .royal .gc-title { color: #f5d06f; text-shadow: 0 0 14px rgba(245,208,111,.45); }
  .gc-rule { margin: 12px 0; color: var(--c2); letter-spacing: 6px; font-size: 12px; }
  .royal .gc-rule { color: #f5d06f; }
  .gc-msg { font: italic 17px/1.6 Georgia, "Times New Roman", serif; color: #334155; white-space: pre-line; }
  .gc-msg .rest { visibility: hidden; } /* typed out, without the card changing size */
  .royal .gc-msg { color: #fde9c4; }
  .gc-quote { margin: 16px auto 0; max-width: 340px; font: italic 15px/1.6 Georgia, serif; color: var(--c1); white-space: pre-line; opacity: .9; }
  .gc-quote::before { content: "“ "; }
  .gc-quote::after { content: " ”"; }
  .royal .gc-quote { color: #f5d06f; }
  .gc-sign { margin-top: 22px; font-size: 13px; color: #64748b; }
  .gc-sign b { display: block; margin-top: 2px; font: 400 32px/1.1 "Great Vibes", "Segoe Script", "Brush Script MT", cursive; color: #0f172a; }
  .royal .gc-sign { color: #e7c98a; }
  .royal .gc-sign b { color: #fff3d6; }
  .gc-tools { margin-top: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .gc-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--c1-40); background: #fff;
            color: var(--c1); font: 600 13px "Segoe UI", sans-serif; cursor: pointer; text-decoration: none; }
  .royal .gc-btn { background: transparent; border-color: #d4a017; color: #f5d06f; }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .cake .flame { animation: none; } .gc-cover { transition: none; } .gc-fx { display: none; } .gc-mark { animation: none; } }
  .msg.saying { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c2) 25%, transparent); }
  .say { float: right; margin: -4px -6px 0 8px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: #fff;
              font-size: 15px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .redeem { display: inline-block; margin: 24px 0 8px; padding: 13px 30px; border-radius: 999px; background: #f59e0b; color: #111827;
            font-weight: 700; font-size: 15px; text-decoration: none; }
  .how { font-size: 12px; color: #94a3b8; line-height: 1.5; }
  .sign { padding: 20px 26px 26px; text-align: center; font-size: 14px; color: #475569; }
  .sign b { color: #0f172a; }

  /* the song's switch */
  .music { position: fixed; right: 16px; bottom: 16px; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
           background: #fff; font-size: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: none; }
  .music.shown { display: block; }
  .music.on { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--c2) 30%, transparent); } }
  /* while the song plays, the gift waits */
  .wait { margin: 22px auto 4px; font-size: 14px; color: #64748b; }
  .wait .notes { display: inline-block; animation: bob 1.4s ease-in-out infinite; }
  .voucher { opacity: 0; transform: scale(.85); transition: opacity .6s, transform .6s cubic-bezier(.2, 1.4, .4, 1); }
  .voucher.in { opacity: 1; transform: none; }
  @keyframes bob { 50% { transform: translateY(-4px); } }

  /* the delivery, inside the card: Santa's sleigh (or the festival's own: diyas, balloons,
     colours, moon, rakhis) crosses it once, in step with the song, and once it's over
     comes back to its middle; then, like a film: the lights dim, the camera closes in, Santa
     takes the gift out and hands it to you, and flies off */
  .card { position: relative; }
  .sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; transition: opacity .5s; }
  .sky.out { opacity: 0; }
  .sleigh { position: absolute; top: 50%; left: 0; white-space: nowrap; font-size: 34px; line-height: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); transform: translate(100vw, -50%); }
  .sleigh.glide { transition: transform 1.2s ease-in-out; }
  .sleigh .ho { transition: opacity .3s; }
  .sleigh.quiet .ho { opacity: 0; }
  .dim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 18%, rgba(0,0,0,.6) 75%);
         opacity: 0; transition: opacity 1s; }
  .dim.on { opacity: 1; }
  .rays { position: absolute; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; opacity: 0; transition: opacity .6s;
          background: repeating-conic-gradient(rgba(253,224,71,.45) 0 9deg, transparent 9deg 22deg);
          -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%);
          animation: spin 8s linear infinite; }
  .rays.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sleigh .ride { display: inline-block; animation: bob .6s ease-in-out infinite; }
  .sleigh .lead { display: inline-block; margin-right: -4px; }
  .sleigh .lead:nth-child(2) { animation-delay: -.3s; }
  .sleigh .sled { position: relative; display: inline-block; margin-left: 4px; }
  .sleigh .sled b { position: absolute; left: 4px; bottom: 16px; font-size: 28px; font-weight: normal; }
  .sleigh .ho { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -8px); white-space: nowrap; padding: 3px 9px;
                border-radius: 10px; background: #fff; color: var(--c1); font: 700 12px "Segoe UI", sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .drop { position: absolute; font-size: 30px; line-height: 1; transform: translate(-50%, -50%); filter: drop-shadow(0 0 14px rgba(253,224,71,.8));
          transition: left 1.2s ease-in-out, top 1.2s ease-in-out, font-size 1.2s ease-in-out, opacity .5s; }
  .drop.hid { opacity: 0; font-size: 8px; }
  .drop.jolt { animation: jolt .35s ease-out; }
  .drop.burst { animation: open .55s ease-in forwards; }
  @keyframes jolt { 30% { transform: translate(-50%, -50%) scale(1.15) rotate(-8deg); } 65% { transform: translate(-50%, -50%) scale(.96) rotate(5deg); } }
  @keyframes open { to { transform: translate(-50%, -50%) scale(1.8) rotate(12deg); opacity: 0; } }
  .spark { position: absolute; font-size: 18px; transform: translate(-50%, -50%); animation: spark .9s ease-out forwards; }
  @keyframes spark { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4); opacity: 0; } }

  /* a greeting card that opened by itself, before any tap: sound needs one */
  .sound { position: fixed; left: 50%; bottom: 20px; z-index: 30; transform: translateX(-50%); padding: 10px 18px; border: 0; border-radius: 999px;
           background: #fff; color: var(--c1); font: 700 14px "Segoe UI", sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.35); cursor: pointer;
           animation: pulse 1.2s ease-in-out infinite; }
  .bad { color: #fff; text-align: center; font-size: 18px; }
  @media (prefers-reduced-motion: reduce) { .fx, .gift .box, .music.on, .wait .notes { animation: none !important; } .fx { display: none; } }
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="wrap">
  <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open your gift">
    <div class="box">🎁</div>
    <h1 id="giftTitle">You've got a gift!</h1>
    <p id="giftFrom"></p>
    <div class="tap">Tap to open</div>
  </div>

      clearTimeout(sayLater); // the song, not Jarvis, now
      voice.pause();
      if (tune) { song.currentTime = 0; song.play().catch(function () {}); }
    };
    wrap.appendChild(cake); wrap.appendChild(hint); wrap.appendChild(blow);
    return wrap;
  }
  if (party && !only) $("voucher").insertBefore(makeCake(), $("voucher").firstChild);
  var sayLater = 0;
  var reveal = function () {
    $("wait").hidden = true;
    var v = $("voucher");
    v.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { v.classList.add("in"); }); });
    setTimeout(function () { v.scrollIntoView({ behavior: "smooth", block: "center" }); }, 300);
    sayLater = setTimeout(say, 1400); // once the crackle's done
    if (only) openBook();
    if (party) confetti(120);
  };
  // who brings it (Santa unless the festival has its own): the gift comes out of .sled
  var lead = function (a, b, sled) { return '<span class="lead">' + a + '</span><span class="lead">' + b + '</span><span class="sled">' + sled + '</span>'; };
  var who = {
    diwali: [lead("✨", "🪔", "🪔"), "Happy Diwali! 🎁"],
    birthday: [lead("🎈", "🎈", "🎈"), "Happy Birthday! 🎁"],
    holi: [lead("💦", "🎨", "🎨"), "Happy Holi! 🎁"],
    eid: [lead("✨", "⭐", "🌙"), "Eid Mubarak! 🎁"],
    raksha: [lead("✨", "🪢", "🪢"), "Happy Raksha Bandhan! 🎁"]
  }[st[0]] || [lead("🦌", "🦌", "🛷<b>🎅</b>"), "Ho ho ho! 🎁"];
  who[1] = who[1].replace("🎁", gem);
  // where he is: p 0 just off the card's right edge, 1 in its middle, 2 off
  // its left edge; z how close the camera is
  var place = function (p, z) {
    at_p = p;
    var w = card.clientWidth, fw = santa.offsetWidth;
    santa.style.transform = "translate(" + Math.round(w - p * (w + fw) / 2) + "px, -50%)" + (z ? " scale(" + z + ")" : "");
  };
  // in step with the song, till it's done
  var follow = function () {
    if (done) return;
    var d = song.duration;
    if (d && isFinite(d)) place(Math.min(2, 2 * song.currentTime / d));
    requestAnimationFrame(follow);
  };
  // the card is up: the sky over it, and Santa on his way
  var startSky = function () {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    sky = document.createElement("div"); sky.className = "sky"; sky.setAttribute("aria-hidden", "true");
    sky.innerHTML = '<div class="dim"></div>';
    card.appendChild(sky);
    if (only) return; // a greeting card's envelope needs no one to bring it
    santa = document.createElement("div"); santa.className = "sleigh";
    santa.innerHTML = '<span class="ride">' + who[0] + '</span><span class="ho">' + who[1] + '</span>';
    sky.appendChild(santa);
    place(0);
    follow();
  };
  var at = function (el) {
    var c = card.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - c.left + r.width / 2, y: r.top - c.top + r.height / 2 };
  };
  var after = function (ms, fn) { setTimeout(fn, ms); };
  // the scene, from Santa in the card's middle
  var handOver = function () {
    var dim = sky.querySelector(".dim");
    dim.classList.add("on");
    place(1, 1.8); // the camera closes in
    after(1300, function () {
      // out of the sack, up above him, glowing
      var from = at(santa.querySelector(".sled"));
      var box = document.createElement("div"); box.className = "drop hid";
      if (only) box.innerHTML = ENV;
      else box.textContent = gem;
      box.style.left = from.x + "px"; box.style.top = from.y + "px";
      sky.insertBefore(box, santa);
      santa.querySelector(".ho").textContent = "Ye lo, aapke liye! " + gem;
      void box.offsetWidth; // from there, not from where it ends up
      box.classList.remove("hid");
      box.style.top = (from.y - 70) + "px"; box.style.fontSize = "52px";
      after(1700, function () {
        // handed over; he's off
        santa.classList.add("quiet");
        place(2, 1);
        present(box, dim);
      });
    });
  };
  // the gift (or the envelope) where it'll open, close to you, glowing: three
  // crackers go off, then the big one opens it
  var present = function (box, dim) {
    var to = at($("wait"));
    var rays = document.createElement("div"); rays.className = "rays";
    rays.style.left = to.x + "px"; rays.style.top = to.y + "px";
    sky.appendChild(box); // in front of everything
    sky.insertBefore(rays, box);
    box.style.left = to.x + "px"; box.style.top = to.y + "px"; box.style.fontSize = "96px";
    after(400, function () { rays.classList.add("on"); });
    var sparks = function (chars, far) {
      chars.forEach(function (ch, i) {
        var sp = document.createElement("span"); sp.className = "spark"; sp.textContent = ch;
        var a = (i + Math.random() * 0.5) / chars.length * Math.PI * 2;
        sp.style.left = to.x + "px"; sp.style.top = to.y + "px";
        sp.style.setProperty("--dx", Math.round(Math.cos(a) * far) + "px");
        sp.style.setProperty("--dy", Math.round(Math.sin(a) * far) + "px");
        sky.appendChild(sp);
      });
    };
    // it's there: three crackers go off, then the big one opens it
    after(1200, function () {
      dim.classList.remove("on");
      crackers.currentTime = 0;
      crackers.play().catch(function () {});
      POPS.forEach(function (ms, k) {
        after(ms, function () {
          box.classList.remove("jolt"); void box.offsetWidth; box.classList.add("jolt");
          sparks(["💥", "✨", "🎇", "✨", "💥", "✨"].slice(0, 3 + k), 45 + 20 * k);
        });
      });
      after(BANG, function () {
        box.classList.remove("jolt");
        rays.classList.remove("on");
        sparks(["💥", "🎉", "⭐", "✨", "🎆", "🎊", "⭐", "✨", "🎇", "🎉"], 140);
        if (!only) {
          box.classList.add("burst");
          reveal();
          return;
        }
        // the envelope opens, the card comes out of it
        box.querySelector(".env").classList.add("open");
        after(1100, function () { box.classList.add("away"); reveal(); });
      });
      var end = BANG + (only ? 2300 : 1200);
      after(end, function () { sky.classList.add("out"); });
      after(end + 600, function () { sky.remove(); });
    });
  };
  var deliver = function () {
    if (delivered) return;
    delivered = true;
    if (!sky) { reveal(); return; }
    if (only) {
      // a greeting card: no one flies it in, the envelope's just there
      var dim = sky.querySelector(".dim");
      dim.classList.add("on");
      var to = at($("wait"));
      var box = document.createElement("div"); box.className = "drop hid"; box.innerHTML = ENV;
      box.style.left = to.x + "px"; box.style.top = to.y + "px";
      sky.appendChild(box);
      void box.offsetWidth; // from nothing, where it is
      box.classList.remove("hid");
      present(box, dim);
      return;
    }
    // off the card if he isn't yet, back in from the right to its middle, then the scene
    santa.classList.add("glide");
    if (at_p <= 0) { // not on his way yet (no tune): straight in
      place(1);
      after(1400, handOver);
      return;
    }
    var gone = at_p >= 1.95 ? 0 : 1200;
    place(2);
    after(gone, function () {
      santa.classList.remove("glide");
      place(0);
      void santa.offsetWidth; // from there, not from the left
      santa.classList.add("glide");
      place(1);
      after(1400, handOver);
    });
  };
  var maybeDeliver = function () { if (opened && done) setTimeout(deliver, 900); };
  var songDone = function () { if (done) return; done = true; maybeDeliver(); };
  song.addEventListener("ended", songDone);
  song.addEventListener("error", songDone);
  if (!tune || only) done = true; // a greeting card doesn't wait on the tune: it plays under the scene

  // no tap yet, so no sound: a tap anywhere brings it (the tune too, if
  // Santa hasn't set off without it)
  var fallback = 0;
  var askSound = function () {
    if (document.querySelector(".sound")) return;
    var chip = document.createElement("button"); chip.type = "button"; chip.className = "sound";
    chip.textContent = "🔊 Awaaz ke liye kahin bhi tap karo";
    document.body.appendChild(chip);
    var go = function () {
      chip.remove();
      document.removeEventListener("pointerdown", go, true);
      document.removeEventListener("keydown", go, true);
      if (tune && (only ? $("voucher").hidden : !done)) song.play().then(function () { clearTimeout(fallback); }, function () {});
    };
    document.addEventListener("pointerdown", go, true);
    document.addEventListener("keydown", go, true);
  };

  var open = function () {
    if (opened) return;
    opened = true;
    if (tune) {
      song.play().catch(function () {
        if (only) askSound();
        fallback = setTimeout(songDone, only ? 6000 : 2500); // a moment to tap for the tune
      });
      setTimeout(songDone, 90000); // a song that never finishes loading
    }
    maybeDeliver();
    var gift = $("gift");
    gift.classList.add("opening");
    setTimeout(function () {
      gift.classList.add("gone");
      card.classList.add("shown");
      requestAnimationFrame(function () { requestAnimationFrame(function () { card.classList.add("in"); }); });
      if (tune) music.classList.add("shown");
      startSky();
    }, 550);
  };
  $("gift").onclick = open;
  $("gift").onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };

  if (only) {
    // a greeting card opens by itself: the email's "Open your card" was the tap
    $("gift").classList.add("gone");
    open();
    if (!tune && !(navigator.userActivation && navigator.userActivation.hasBeenActive)) askSound();
  } else {
    // where the browser lets a page play sound by itself, the gift opens with
    // the music right away; else it waits for the tap
    var tried = tune && song.play();
    if (tried && tried.then) tried.then(function () { setTimeout(open, 900); }, function () {});
  }
})();
</script>
